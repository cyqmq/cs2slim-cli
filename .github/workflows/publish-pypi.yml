name: publish-pypi

# 自动发布：push 形如 vX.Y.Z 的 tag 时触发。
#  - 构建 wheel + sdist（python -m build）
#  - 构建单文件 zipapp（cs2slim.pyz）
#  - 创建 GitHub Release（附带 wheel/sdist/pyz/安装脚本）
#  - 发布到 PyPI（OIDC 可信发布，无需 token）
#
# PyPI 可信发布（Trusted Publisher）配置（无需任何 Secret/token）：
#   1. 打开 PyPI 项目（首次发布前为"待认领"）：https://pypi.org/manage/project/cs2slim/
#      （若项目不存在，先注册/创建，或用"待发布者"方式首次自动创建）
#   2. Project -> Settings -> Publishing -> Add trusted publisher:
#        PyPI project name : cs2slim
#        Owner             : cyqmq
#        Repository        : cs2slim-cli
#        Workflow name     : publish-pypi.yml
#        Environment       : (留空)
#   3. push 一个 v* tag 即自动发布到 PyPI
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write   # OIDC：用于 PyPI 可信发布（无需 API token）

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build tools
        run: pip install --upgrade build
      - name: Build wheel and sdist
        run: python -m build
      - name: Build zipapp
        run: bash scripts/make_zipapp.sh release-assets
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${{ github.ref_name }}" >/dev/null 2>&1; then
            echo "Release ${{ github.ref_name }} 已存在，跳过"
          else
            gh release create "${{ github.ref_name }}" \
              dist/*.whl dist/*.tar.gz release-assets/cs2slim.pyz \
              scripts/get-cs2slim.sh scripts/get-cs2slim.ps1 \
              --generate-notes
          fi
      - name: Publish to PyPI (trusted publishing / OIDC)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          # 无需 __token__：GitHub Actions 通过 OIDC 向 PyPI 证明身份
